name: Esvaziar as filas (ChatPro e parceiros)

# 🔴 POR QUE ESTE ARQUIVO EXISTE
#
# Descoberto em 10/09/2026: os crons deste projeto estavam declarados em `vercel.json` — e o
# projeto NÃO roda na Vercel desde a migração para AWS EC2 + PM2 (DT-006, DT-008). Não havia
# nenhum workflow com `schedule:`. Logo, nenhum cron jamais rodou aqui.
#
# O efeito nas filas novas: o webhook do ChatPro aceita o evento e devolve 202 — medido em
# produção, `202 · 496ms` no painel deles — e o evento fica `pendente` para sempre, porque
# ninguém chama o processador. O paciente manda a mensagem e o link nunca chega.
#
# ⚠️ ISTO É UMA PONTE, NÃO O DESTINO. A ADR-0020 §4 registra a comparação: para o paciente que
# espera um link no WhatsApp, cinco minutos é muito, e a resposta certa é um worker próprio no
# PM2 consumindo a fila em laço (opção C). Isto aqui é a opção B — escolhida para o QA porque
# fica versionada, aparece no `git log` e não depende de ninguém lembrar de um `crontab -e`
# dentro de uma máquina, que é exatamente o padrão que produziu o incidente do Item 28.
#
# LIMITE HONESTO: depende do GitHub Actions estar de pé, e o `schedule` do GitHub ATRASA em
# horário de pico — a doc oficial não garante pontualidade. Para o QA é aceitável; para
# produção, não.

on:
  schedule:
    # A cada 5 minutos — o menor intervalo que o GitHub aceita.
    - cron: '*/5 * * * *'
  # Disparo manual: no QA ninguém espera cinco minutos para ver se funcionou.
  workflow_dispatch:

# Duas execuções simultâneas não se atropelam: as rotas usam `FOR UPDATE SKIP LOCKED`, então
# uma segunda chamada simplesmente não acha nada para reivindicar. O `concurrency` evita a
# fila de jobs acumulada quando o Actions atrasa.
concurrency:
  group: filas
  cancel-in-progress: false

jobs:
  esvaziar:
    runs-on: ubuntu-latest
    steps:
      - name: Processar os eventos do ChatPro
        run: |
          CODIGO=$(curl -s -o /tmp/chatpro.json -w "%{http_code}" --max-time 60 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://be4hope.org/api/chatpro/processar")
          echo "HTTP $CODIGO"
          cat /tmp/chatpro.json
          echo
          # 503 = CRON_SECRET ausente no servidor · 401 = segredo diferente do cadastrado.
          # Os dois são erro de configuração e precisam aparecer, não virar silêncio.
          if [ "$CODIGO" != "200" ]; then
            echo "::error::processador do ChatPro respondeu $CODIGO"
            exit 1
          fi

      - name: Enviar os avisos pendentes ao parceiro
        # `if: always()` porque as duas filas são independentes: o ChatPro falhar não é motivo
        # para a Greens deixar de receber o aviso de uma receita que já foi assinada.
        if: always()
        run: |
          CODIGO=$(curl -s -o /tmp/parceiros.json -w "%{http_code}" --max-time 60 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://be4hope.org/api/parceiros/enviar")
          echo "HTTP $CODIGO"
          cat /tmp/parceiros.json
          echo
          if [ "$CODIGO" != "200" ]; then
            echo "::error::enviador de parceiros respondeu $CODIGO"
            exit 1
          fi
