name: Deploy para AWS (CI/CD)

on:
  push:
    branches:
      - main # O deploy será acionado sempre que houver push na branch main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Instalar dependências
        run: pnpm install --no-frozen-lockfile

      - name: Build do projeto (Next.js)
        # Passar variáveis públicas necessárias para o build
        env:
          NEXT_PUBLIC_APP_URL: "https://be4hope.org"
        run: pnpm build

      - name: Sincronizar arquivos para AWS (rsync)
        uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ARGS: "-rltgoDzvO --delete"
          SOURCE: "./"
          REMOTE_HOST: ${{ secrets.SERVER_IP }}
          REMOTE_USER: ${{ secrets.SERVER_USER }}
          TARGET: ${{ secrets.TARGET_DIR }}
          # Excluir arquivos que não precisam ser enviados
          EXCLUDE: "/node_modules/, /.git/, /.github/, /.env, /pnpm-lock.yaml"

      - name: Reiniciar Servidor (PM2)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ${{ secrets.TARGET_DIR }}
            
            # Instala apenas as dependências necessárias para rodar (economiza RAM na AWS)
            pnpm install --prod
            
            # Aplica eventuais migrações do banco (opcional, remova se preferir fazer manual)
            pnpm db:migrate
            
            # Reinicia a aplicação
            pm2 restart all
